{% extends 'base.html' %}
{% block content %}<div class="container"><h1>Feedback</h1><form method="post">{% csrf_token %}<label>Subject<input class="form-control" name="subject" required></label><label>Message<textarea class="form-control" name="message" required></textarea></label><label>Rating<input class="form-control" type="number" min="1" max="5" name="rating" value="5"></label><button class="btn btn-primary mt-3">Submit feedback</button></form></div>{% endblock %}
