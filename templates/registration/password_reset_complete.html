{% extends 'base.html' %}
{% block title %}Password changed — All-in-One Fitness{% endblock %}
{% block content %}
<div class="auth-wrap">
  <div class="auth-card text-center">
    <i class="bi bi-check-circle text-success" style="font-size:3rem"></i>
    <h1 class="mt-2">Password changed</h1>
    <p class="text-muted">You can now log in with your new password.</p>
    <a href="{% url 'login' %}" class="btn btn-brand mt-2">Log in</a>
  </div>
</div>
{% endblock %}
