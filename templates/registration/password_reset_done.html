{% extends 'base.html' %}
{% block title %}Check your email — All-in-One Fitness{% endblock %}
{% block content %}
<div class="auth-wrap">
  <div class="auth-card text-center">
    <i class="bi bi-envelope-check text-success" style="font-size:3rem"></i>
    <h1 class="mt-2">Check your email</h1>
    <p class="text-muted">If an account exists for that address, a password reset link has been sent. In demo mode the email is printed to the terminal console.</p>
    <a href="{% url 'login' %}" class="btn btn-brand mt-2">Back to login</a>
  </div>
</div>
{% endblock %}
