{% extends 'base.html' %}
{% block content %}<div class="container"><h1>My payments</h1><table class="table"><tr><th>Date</th><th>Amount</th><th>Status</th></tr>{% for payment in payments %}<tr><td>{{ payment.payment_date }}</td><td>{{ payment.amount }}</td><td>{{ payment.status }}</td></tr>{% empty %}<tr><td colspan="3">No payments found.</td></tr>{% endfor %}</table></div>{% endblock %}
