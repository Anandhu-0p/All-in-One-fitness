{% extends 'dashboard_base.html' %}
{% block title %}{{ mode }} — All-in-One Fitness{% endblock %}
{% block page_title %}{{ mode }}{% endblock %}
{% block content %}
<div class="row justify-content-center">
  <div class="col-lg-7">
    <div class="card"><div class="card-body">
      <form method="post" novalidate>
        {% csrf_token %}
        {% include 'partials/form.html' %}
        <button type="submit" class="btn btn-brand">Save batch</button>
        <a href="{% url 'manage_batches' %}" class="btn btn-outline-secondary">Cancel</a>
      </form>
    </div></div>
  </div>
</div>
{% endblock %}
