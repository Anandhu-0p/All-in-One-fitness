{% block header %}
<div class="page-head">
  <div>
    <h1>{% block header_title %}{{ title|default:'Page' }}{% endblock %}</h1>
    {% if subtitle %}<p>{{ subtitle }}</p>{% endif %}
  </div>
  {% if actions %}
    <div class="d-flex gap-2 flex-wrap">
      {% for action in actions %}
        <a href="{{ action.url }}" class="btn {{ action.style|default:'btn-brand' }} btn-sm px-3">
          {% if action.icon %}<i class="bi {{ action.icon }} me-1"></i>{% endif %}{{ action.label }}
        </a>
      {% endfor %}
    </div>
  {% endif %}
</div>
{% endblock %}
