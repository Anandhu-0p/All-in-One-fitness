{% extends 'base.html' %}
{% block content %}
<div class="login-wrap">
  <div class="auth-card panel">
  <h1>Welcome back</h1>
  <p class="muted">Sign in to continue your fitness journey.</p>
  <form method="post">
    {% csrf_token %}
    {{ form.non_field_errors }}
    <p><label for="id_username">Username</label>{{ form.username }}</p>
    <p><label for="id_password">Password</label>{{ form.password }}</p>
    <button type="submit" class="btn btn-red">Log in</button>
  </form>
  </div>
</div>
{% endblock %}
